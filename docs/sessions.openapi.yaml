openapi: 3.0.3
info:
  title: DevFest Paris — Sessions API
  version: 1.0.0
  description: 'API pédagogique en lecture seule du catalogue des sessions du DevFest Paris 2026. Accès
    public : aucune clé ni authentification.'
servers:
- url: https://devfest-sessions-5c7fh3spka-ew.a.run.app
  description: API publique en lecture seule
paths:
  /sessions:
    get:
      operationId: search_sessions
      summary: Rechercher les sessions du DevFest Paris 2026
      description: Catalogue du 27 novembre 2026. Pauses exclues. Filtres cumulés. Retourne les horaires,
        salles, IDs et sources ; ne réserve aucune place.
      parameters:
      - name: query
        in: query
        required: false
        description: 'Mots-clés courts : titre, résumé ou nom de speaker. Recherche lexicale AND, sans
          distinction des accents. Vide pour lister.'
        schema:
          type: string
          maxLength: 300
          default: ''
      - name: language
        in: query
        required: false
        description: Langue de la session. Omettre pour toutes les langues.
        schema:
          type: string
          enum:
          - fr
          - en
      - name: starts_after
        in: query
        required: false
        description: Début au plus tôt, inclusif, heure Europe/Paris HH:MM.
        schema:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      - name: ends_before
        in: query
        required: false
        description: Fin au plus tard, inclusif, heure Europe/Paris HH:MM.
        schema:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      - name: format
        in: query
        required: false
        description: Format exact de la session.
        schema:
          type: string
          enum:
          - Conference
          - Workshop
          - Quick Talk
          - Keynote
      - name: limit
        in: query
        required: false
        description: Nombre maximal de résultats.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
      responses:
        '200':
          description: Résultats ou liste vide.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - total
                - truncated
                - search_mode
                - sessions
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - empty
                  total:
                    type: integer
                  truncated:
                    type: boolean
                  search_mode:
                    type: string
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '400':
          description: Paramètres invalides.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /sessions/{session_id}:
    get:
      operationId: get_session
      summary: Lire les détails d’une session par son ID
      description: Utiliser un session_id retourné par search_sessions. Inclut le résumé complet et les
        horaires de référence.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: Identifiant retourné par search_sessions.
      responses:
        '200':
          description: Session trouvée.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - session
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  session:
                    $ref: '#/components/schemas/Session'
        '404':
          description: Session inconnue ou pause non sélectionnable.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  message:
                    type: string
components:
  schemas:
    Session:
      type: object
      required:
      - session_id
      - title
      - room
      - date
      - timezone
      - start
      - end
      - language
      - format
      - speakers
      - source_url
      - retrieved_on
      properties:
        session_id:
          type: string
        title:
          type: string
        room:
          type: string
        date:
          type: string
        timezone:
          type: string
        start:
          type: string
        end:
          type: string
        language:
          type: string
        format:
          type: string
        source_url:
          type: string
        retrieved_on:
          type: string
        speakers:
          type: array
          items:
            type: string
        description:
          type: string
